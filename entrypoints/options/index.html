<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>白名单管理 · B站UP音量白名单</title>
    <link rel="icon" type="image/png" href="/icons/icon-32.png" />
  </head>
  <body>
    <header class="site-header"><div class="header-inner"><a href="./options.html" class="brand"><img src="/icons/icon-48.png" width="28" height="28" alt="" />B站UP音量白名单</a><span class="badge">本机保存</span></div></header>
    <main>
      <div class="page-heading"><div><h1>白名单管理</h1><p>每位 UP 主独立记忆音量，默认 70%，可在视频播放器或扩展弹窗中调整。</p></div><span class="total">共 <strong id="count">0</strong> 位 UP 主</span></div>
      <section class="add-card" aria-labelledby="add-heading">
        <h2 id="add-heading">添加 UP 主</h2>
        <form id="add-form">
          <div class="field uid-field"><label for="uid">UID 或个人空间链接</label><input id="uid" name="uid" placeholder="例如 123456 或 https://space.bilibili.com/123456" required maxlength="200" disabled /></div>
          <div class="field"><label for="creator-label">备注名称 <span>选填</span></label><input id="creator-label" name="name" placeholder="方便自己辨认" maxlength="80" disabled /></div>
          <button id="add-manual" type="submit" class="primary" disabled>＋ 加入白名单</button>
        </form>
        <p id="feedback" role="status" aria-live="polite"></p>
      </section>
      <section class="list-card" aria-labelledby="list-heading">
        <div class="backup-toolbar">
          <button id="export-whitelist" type="button" disabled>导出白名单</button>
          <label for="import-mode">导入方式</label>
          <select id="import-mode" disabled><option value="merge">合并（保留备注与音量）</option><option value="replace">替换全部白名单</option></select>
          <button id="choose-import" type="button" disabled>选择文件</button>
          <input id="import-file" type="file" accept=".json,application/json" hidden />
          <span id="import-preview">JSON 文件，包含成员音量，不改变非白名单音量和开关。</span>
          <button id="confirm-import" type="button" disabled>确认导入</button>
        </div>
        <div class="list-toolbar"><h2 id="list-heading">全部 UP 主</h2><label class="search"><span class="sr-only">搜索白名单</span><input id="search" type="search" placeholder="搜索名称或 UID" /></label></div>
        <div class="table-heading" aria-hidden="true"><span>UP 主</span><span>UID</span><span>操作</span></div>
        <ul id="creator-list" aria-label="白名单 UP 主"></ul>
        <div id="empty" class="empty"><p id="empty-title">白名单还是空的</p><p id="empty-detail">在上方添加 UP 主，或在视频弹窗中一键加入。</p></div>
        <nav class="pagination" aria-label="白名单分页"><span id="page-info" role="status"></span><div><button id="previous-page" type="button" disabled>上一页</button><button id="next-page" type="button" disabled>下一页</button></div></nav>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
